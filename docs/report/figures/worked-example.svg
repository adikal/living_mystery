<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">Knowledge and reasoning in one case, at design time and at run time</title><desc id="desc">At design time a language model proposes a refinement, the kernel certifies it and checks the refinement laws, a second model reviews its plausibility, and at the end the kernel and Z3 certify the whole case. At run time the director, a character or the player proposes, and code, a model and the kernel or Z3 decide; only accepted changes are written to the one true history, which both phases read and write.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#496779" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f5f7f7"/><style>text{font-family:Arial,sans-serif;fill:#17313e} .label{font-size:15px;font-weight:600} .small{font-size:12.5px;fill:#4d6270} .head{font-size:16px;font-weight:700} .prop{fill:#fff;stroke:#496779;stroke-width:1.6;stroke-dasharray:6 4} .code{fill:#fff;stroke:#496779;stroke-width:1.6} .crit{fill:#fff;stroke:#496779;stroke-width:4} .band{fill:#e3eaec;stroke:#496779;stroke-width:2} .edge{stroke:#496779;stroke-width:1.7;fill:none;marker-end:url(#arrow)}</style>
<text x="25" y="34" class="head">Design time: writing the case (minutes per case)</text>
<rect x="25" y="50" width="200" height="74" rx="10" class="prop"/><text x="125" y="78" class="label" text-anchor="middle">Proposal (Opus)</text><text x="125" y="98" class="small" text-anchor="middle">a refinement: new events,</text><text x="125" y="114" class="small" text-anchor="middle">attitudes and signs</text>
<rect x="265" y="50" width="200" height="74" rx="4" class="code"/><text x="365" y="78" class="label" text-anchor="middle">Kernel (code)</text><text x="365" y="98" class="small" text-anchor="middle">certify; refinement laws;</text><text x="365" y="114" class="small" text-anchor="middle">physical possibility</text>
<rect x="505" y="50" width="200" height="74" rx="10" class="prop"/><text x="605" y="78" class="label" text-anchor="middle">Reviewer (Sonnet)</text><text x="605" y="98" class="small" text-anchor="middle">is the beat plausible</text><text x="605" y="114" class="small" text-anchor="middle">for these people?</text>
<rect x="745" y="50" width="190" height="74" rx="4" class="crit"/><text x="840" y="78" class="label" text-anchor="middle">Publish gate</text><text x="840" y="98" class="small" text-anchor="middle">Python and JS kernels</text><text x="840" y="114" class="small" text-anchor="middle">and Z3 must agree</text>
<path class="edge" d="M225,87 L261,87"/><path class="edge" d="M465,87 L501,87"/><path class="edge" d="M705,87 L741,87"/>
<path class="edge" d="M365,124 C365,150 125,150 125,128"/><text x="245" y="160" class="small" text-anchor="middle">refused with the reasons: write again</text>
<rect x="25" y="200" width="910" height="56" rx="6" class="band"/><text x="480" y="226" class="label" text-anchor="middle">One true history: entities · events · attitudes · signs with typed claims · the question</text><text x="480" y="245" class="small" text-anchor="middle">the only source of facts; nothing is written to it unless the critics accept it</text>
<path class="edge" d="M840,124 L840,196"/>
<text x="25" y="298" class="head">Run time: playing the case (seconds per turn)</text>
<rect x="25" y="314" width="200" height="74" rx="10" class="prop"/><text x="125" y="342" class="label" text-anchor="middle">Proposal</text><text x="125" y="362" class="small" text-anchor="middle">director's plan, a character's</text><text x="125" y="378" class="small" text-anchor="middle">reply, the player's charge</text>
<rect x="265" y="314" width="200" height="74" rx="4" class="code"/><text x="365" y="342" class="label" text-anchor="middle">Code checks</text><text x="365" y="362" class="small" text-anchor="middle">place, time, knowledge,</text><text x="365" y="378" class="small" text-anchor="middle">names, times, accounts</text>
<rect x="505" y="314" width="200" height="74" rx="10" class="prop"/><text x="605" y="342" class="label" text-anchor="middle">Model critic</text><text x="605" y="362" class="small" text-anchor="middle">fact-checker; line critic:</text><text x="605" y="378" class="small" text-anchor="middle">does it add a fact?</text>
<rect x="745" y="314" width="190" height="74" rx="4" class="crit"/><text x="840" y="342" class="label" text-anchor="middle">Kernel / Z3</text><text x="840" y="362" class="small" text-anchor="middle">still solvable? which</text><text x="840" y="378" class="small" text-anchor="middle">suspects survive, and why</text>
<path class="edge" d="M225,351 L261,351"/><path class="edge" d="M465,351 L501,351"/><path class="edge" d="M705,351 L741,351"/>
<path class="edge" d="M840,314 L840,260"/><path class="edge" d="M125,260 L125,310"/><text x="135" y="290" class="small">reads its facts</text><text x="850" y="290" class="small">writes only what is accepted</text>
<text x="480" y="440" class="small" text-anchor="middle">Dashed boxes are models; solid boxes are code; the thick box is the certifying decision. Each refusal carries its reason back to the proposer.</text>
</svg>
