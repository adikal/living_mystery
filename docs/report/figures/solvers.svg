<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Proposed multi-logic translation architecture</title><desc id="desc">A proposed typed semantic layer feeds supported fragments to Z3, ASP or certificates. Results retain assumptions and provenance; only controlled engine admission may update knowledge.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#496779" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f5f7f7"/><style>text{font-family:Arial,sans-serif;fill:#17313e} .label{font-size:17px;font-weight:600} .small{font-size:14px;fill:#4d6270} .edge{stroke:#496779;stroke-width:1.7;fill:none;marker-end:url(#arrow)}</style>
<rect x="35" y="35" width="890" height="90" rx="8" fill="#fcf8ed" stroke="#a88950" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="51" y="62" class="label" text-anchor="start">Proposed shared semantic model</text>
<text x="51" y="85" class="small" text-anchor="start">Entities · events · assertions · beliefs · temporal scopes · rules · provenance</text>
