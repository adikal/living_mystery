<text x="51" y="232" class="label" text-anchor="start">Z3 adapter</text>
<text x="51" y="255" class="small" text-anchor="start">Implemented: finite action IR</text>
<text x="51" y="276" class="small" text-anchor="start">Time · location · possession</text>
<rect x="345" y="205" width="270" height="110" rx="8" fill="#fcf8ed" stroke="#a88950" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="361" y="232" class="label" text-anchor="start">ASP adapter</text>
<text x="361" y="255" class="small" text-anchor="start">Proposed: discrete search</text>
<text x="361" y="276" class="small" text-anchor="start">Explicit stable-model semantics</text>
<rect x="655" y="205" width="270" height="110" rx="8" fill="#fcf8ed" stroke="#a88950" stroke-width="1.5" stroke-dasharray="6 4"/>
