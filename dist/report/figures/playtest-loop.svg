<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">The playtesting loop as the scientific method</title><desc id="desc">Agent players play cases through a text interface; a scorecard and a judge score each game; the optimizer clusters problems, explains a cause, registers a prediction and proposes a narrow change; the change is checked by tests and an offline replay, then played on held-out cases paired with the baseline; a gate keeps or reverts it, and the ledger records the result for the next epoch.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#496779" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f5f7f7"/><style>text{font-family:Arial,sans-serif;fill:#17313e} .label{font-size:16px;font-weight:600} .small{font-size:13px;fill:#4d6270} .box{fill:#fff;stroke:#496779;stroke-width:1.6} .dash{fill:#fff;stroke:#496779;stroke-width:1.6;stroke-dasharray:6 4} .double{fill:#fff;stroke:#496779;stroke-width:4} .edge{stroke:#496779;stroke-width:1.7;fill:none;marker-end:url(#arrow)}</style>
<text x="25" y="36" class="label">One epoch · solid boxes run code, dashed boxes are models, the thick box decides</text>
<rect x="30" y="70" width="190" height="80" rx="8" class="dash"/><text x="125" y="102" class="label" text-anchor="middle">1 Play</text><text x="125" y="124" class="small" text-anchor="middle">agent players, 3 profiles,</text><text x="125" y="140" class="small" text-anchor="middle">text interface only</text>
<rect x="270" y="70" width="190" height="80" rx="8" class="box"/><text x="365" y="102" class="label" text-anchor="middle">2 Score</text><text x="365" y="124" class="small" text-anchor="middle">scorecard from the trace;</text><text x="365" y="140" class="small" text-anchor="middle">a separate model judges</text>
<rect x="510" y="70" width="190" height="80" rx="8" class="dash"/><text x="605" y="102" class="label" text-anchor="middle">3 Observe, explain</text><text x="605" y="124" class="small" text-anchor="middle">cluster problems; state a</text><text x="605" y="140" class="small" text-anchor="middle">cause, checked in the data</text>
<rect x="750" y="70" width="180" height="80" rx="8" class="dash"/><text x="840" y="102" class="label" text-anchor="middle">4 Predict</text><text x="840" y="124" class="small" text-anchor="middle">hypothesis, metric, side</text><text x="840" y="140" class="small" text-anchor="middle">effects, refutation → ledger</text>
<rect x="750" y="250" width="180" height="80" rx="8" class="dash"/><text x="840" y="282" class="label" text-anchor="middle">5 Change</text><text x="840" y="304" class="small" text-anchor="middle">narrow, general, one</text><text x="840" y="320" class="small" text-anchor="middle">commit, with its test</text>
<rect x="510" y="250" width="190" height="80" rx="8" class="box"/><text x="605" y="282" class="label" text-anchor="middle">6 Test cheaply</text><text x="605" y="304" class="small" text-anchor="middle">all tests and parity;</text><text x="605" y="320" class="small" text-anchor="middle">offline replay of questions</text>
<rect x="270" y="250" width="190" height="80" rx="8" class="box"/><text x="365" y="282" class="label" text-anchor="middle">7 Experiment</text><text x="365" y="304" class="small" text-anchor="middle">held-out cases, paired with</text><text x="365" y="320" class="small" text-anchor="middle">the baseline, one change per arm</text>
<rect x="30" y="250" width="190" height="80" rx="8" class="double"/><text x="125" y="282" class="label" text-anchor="middle">8 Gate, conclude</text><text x="125" y="304" class="small" text-anchor="middle">keep or revert; record</text><text x="125" y="320" class="small" text-anchor="middle">result against prediction</text>
<path class="edge" d="M220,110 L266,110"/><path class="edge" d="M460,110 L506,110"/><path class="edge" d="M700,110 L746,110"/><path class="edge" d="M840,150 L840,246"/><path class="edge" d="M750,290 L704,290"/><path class="edge" d="M510,290 L464,290"/><path class="edge" d="M270,290 L224,290"/><path class="edge" d="M125,250 L125,154"/>
<text x="480" y="390" class="small" text-anchor="middle">The author approves every change before step 7. A failed change returns to step 3 with a new explanation.</text>
</svg>
